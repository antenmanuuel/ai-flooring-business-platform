# Checks every push and pull request: the server's tests (against a MySQL service) and the
# website's lint, tests and production build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ci-password
      JWT_SECRET: ci-only-secret-that-is-at-least-32-bytes-long

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Compiles, runs the tests (they create and use anna_flooring_springboot_test), builds the jar.
      - name: Test and build
        run: ./mvnw -B -ntp verify

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      # `npm run db:setup` (started by playwright.config.js) needs server/.env.
      - name: Create server/.env
        working-directory: server
        run: |
          printf '%s\n' 'DB_HOST=127.0.0.1' 'DB_PORT=3306' 'DB_USER=root' 'DB_PASSWORD=ci-password' \
            'JWT_SECRET=ci-only-secret-that-is-at-least-32-bytes-long' > .env

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            client/playwright-report
            client/test-results
          retention-days: 7

  ai:
    name: AI assistant tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.32'
          enable-cache: true
          cache-dependency-glob: ai/uv.lock
      # The tests use LangChain's fake chat model and fake embeddings: no API key or model download.
      - run: uv sync --frozen
      - run: uv run pytest -q

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build

  client:
    name: Website lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
