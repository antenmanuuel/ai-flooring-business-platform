[project]
name = "anna-flooring-ai"
version = "0.1.0"
description = "Anna Flooring website assistant: RAG with LangChain, ChromaDB and Claude"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.165.0",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.12",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.8.4",
    "langchain-text-splitters>=1.1.3",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
