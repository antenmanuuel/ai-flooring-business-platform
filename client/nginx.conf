# Serves the built website and forwards /api to the Spring Boot container (the same job the
# Vite proxy does in development).
server {
  listen 80;
  root /usr/share/nginx/html;

  # Quote requests carry up to 5 photos of 5 MB each.
  client_max_body_size 40m;

  location /api/ {
    proxy_pass http://server:5050;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Built files have content hashes in their names, so they can be cached for a long time.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Every other path is a page of the React app (e.g. /client/requests/1002).
  location / {
    try_files $uri /index.html;
  }
}
