spring.application.name=flooring-server

# Settings come from server/.env (KEY=value lines, no quotes). Real environment variables win over it.
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:5050}
# Behind nginx or a load balancer, take the visitor's IP (and http/https) from X-Forwarded-For and
# X-Forwarded-Proto. Tomcat only believes those headers from private-network addresses (the proxies),
# so a visitor can't fake their IP by sending the header themselves.
server.forward-headers-strategy=native

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:anna_flooring_springboot_db}?allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10

# Migrations in src/main/resources/db/migration run on startup (and in `npm run db:setup`).
# A database made before migrations existed has tables but no history; it's marked as version 0,
# so V1 still runs there (its IF NOT EXISTS makes that safe) and later versions apply normally.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Secret used to sign login tokens. Required; the server refuses to start without it.
app.jwt-secret=${JWT_SECRET:}
# Send the login cookie over HTTPS only. Turn on when deployed behind HTTPS.
app.cookie-secure=${COOKIE_SECURE:false}

# Photo uploads. The 5 MB-per-photo rule is checked in code (ImageStorage) so the form can show a
# message under the field; these limits only stop oversized requests (a 5-photo quote request is about 25 MB).
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=40MB

# Actuator: only the health endpoint, at /api/actuator/health (so the dev proxy forwards it too).
# It reports UP or DOWN, including the database and disk space, without exposing details.
management.endpoints.web.base-path=/api/actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# This is a JSON API: unknown paths get a JSON 404 (see ApiExceptionHandler) instead of static files.
spring.web.resources.add-mappings=false
# Expected 4xx responses (e.g. 401 from /api/auth/me when logged out) aren't worth a log line each.
spring.mvc.log-resolved-exception=false
logging.level.org.springframework.web.servlet.PageNotFound=error
