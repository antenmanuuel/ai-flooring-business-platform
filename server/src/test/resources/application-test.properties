# Settings for the tests (profile "test"). The tests empty every table before each test, so they use
# their own database, never DB_NAME. It's created automatically, and Flyway builds its tables.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${TEST_DB_NAME:anna_flooring_springboot_test}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true

# Tests don't need a real secret; a JWT_SECRET from .env or the environment still wins.
app.jwt-secret=${JWT_SECRET:test-only-secret-that-is-at-least-32-bytes-long}

# Uploaded test photos go under target/ instead of the real uploads folder.
app.uploads-dir=target/test-uploads

spring.main.banner-mode=off
logging.level.org.flywaydb=warn
